[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kumaru"
version = "0.1.0"
description = "Kumaru - a local-first, scalable LLM chat agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.26",
]

[project.optional-dependencies]
# Run a Hugging Face model in-process (GPU or CPU).
transformers = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.27",
]
# Run a quantised GGUF model on CPU / Apple Silicon.
llamacpp = [
    "llama-cpp-python>=0.2.60",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
kumaru = "kumaru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
