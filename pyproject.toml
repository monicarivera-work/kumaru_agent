[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kumaru"
version = "0.2.0"
description = "Kumaru — a local-first, scalable LLM agent: pluggable inference backends, OpenAI-compatible server, web UI, and a training stack that scales from one GPU to many."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kumaru" }]
keywords = ["llm", "agent", "inference", "fine-tuning", "lora", "local-first"]

# ---------------------------------------------------------------------------
# BASE dependencies: everything needed to run the server, UI, CLI, and the
# `echo`, `openai_compat` and `llamacpp_server` backends (llama-server itself is
# a separate binary; huggingface_hub downloads its GGUF models). Deliberately
# light and pure-Python so `pip install -e .` works on any machine in seconds,
# with no GPU and no compiler toolchain. Heavy ML deps live in optional extras
# below.
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# Local GPU/CPU inference with Hugging Face transformers, plus LoRA fine-tuning.
torch = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    "tokenizers>=0.19",
    "numpy>=1.26",
]
train = [
    "kumaru[torch]",
    "peft>=0.12",
    "datasets>=2.20",
    "tensorboard>=2.17",
]
# Quantized (4-bit) fine-tuning + inference. Separate because bitsandbytes
# is the most platform-fragile dependency in the stack.
quant = ["bitsandbytes>=0.43"]
# GGUF / llama.cpp backend for low-VRAM and CPU-only machines.
gguf = ["llama-cpp-python>=0.2.90"]
# `kumaru bench`: public benchmark datasets, and IFEval's language detection and
# NLTK counting (the same tokenizers as the reference implementation).
# (numpy, from the torch extra, makes the bootstrap ~1000x faster; optional.)
bench = [
    "datasets>=2.20",
    "langdetect>=1.0.9",
    "nltk>=3.9.1",
    "regex>=2023.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
]
all = ["kumaru[train,quant,gguf,bench,dev]"]

[project.scripts]
kumaru = "kumaru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kumaru = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

# numpy 2.5+ writes its stubs in Python 3.12 syntax, which a 3.10 target can't
# parse: mypy would stop before checking any of Kumaru. Skip them (numpy -> Any).
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
