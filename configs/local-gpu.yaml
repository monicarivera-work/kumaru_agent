# 16 GB+ of VRAM: run unquantised weights in-process with transformers.
#
# 1. pip install -e '.[transformers]'   (install a CUDA build of torch first)
# 2. kumaru serve -c configs/local-gpu.yaml
#
# The first run downloads weights to your Hugging Face cache. Swap `model`
# for a local directory to use your own fine-tune.

backend:
  name: transformers
  model: Qwen/Qwen2.5-7B-Instruct
  device: auto      # auto -> cuda when available, else cpu
  dtype: auto       # auto -> bfloat16 on modern GPUs

agent:
  max_tokens: 1024
  temperature: 0.7

server:
  host: 127.0.0.1
  port: 8000
